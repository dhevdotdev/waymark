name: Bug
description: Something behaves wrongly
labels: [needs-triage, bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Do not paste private note content.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: Waymark commit or build date
