[package]
name = "waymark"
version = "0.1.0"
description = "A reader for Markdown vaults kept in Git"
edition = "2024"
rust-version = "1.90"

[lib]
name = "waymark_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-debouncer-mini = "0.7"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
